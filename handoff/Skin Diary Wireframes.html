<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피부일기 — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f2ee; font-family: 'Noto Sans KR', sans-serif; }

  /* Sketchy global styles */
  .sketch-font { font-family: 'Caveat', cursive; }
  .phone-shell {
    width: 320px;
    background: #fff;
    border-radius: 32px;
    border: 2.5px solid #222;
    overflow: hidden;
    position: relative;
    box-shadow: 4px 4px 0 #222;
  }
  .phone-notch {
    height: 28px;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .phone-notch-pill {
    width: 60px; height: 10px;
    background: #444;
    border-radius: 10px;
  }
  .phone-screen {
    padding: 0;
    min-height: 580px;
    background: #fafaf8;
    position: relative;
  }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 16px 4px;
    font-size: 10px;
    font-family: 'Caveat', cursive;
    color: #555;
    border-bottom: 1px solid #eee;
  }
  .nav-bar {
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 0 12px;
    border-top: 1.5px solid #ddd;
    background: #fff;
  }
  .nav-icon {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 9px; color: #999;
    font-family: 'Caveat', cursive;
  }
  .nav-icon.active { color: #222; }
  .nav-dot {
    width: 22px; height: 22px;
    border: 1.5px solid currentColor;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .nav-icon.active .nav-dot { background: #222; color: #fff; border-color: #222; }

  /* sketch elements */
  .sketch-btn {
    border: 2px solid #222;
    border-radius: 10px;
    padding: 10px 20px;
    font-family: 'Caveat', cursive;
    font-size: 16px;
    font-weight: 700;
    background: #222;
    color: #fff;
    text-align: center;
    cursor: pointer;
    box-shadow: 3px 3px 0 #888;
  }
  .sketch-btn.secondary {
    background: transparent;
    color: #222;
    box-shadow: 2px 2px 0 #bbb;
  }
  .sketch-btn.accent {
    background: #c8e6c9;
    color: #222;
    border-color: #222;
    box-shadow: 3px 3px 0 #aaa;
  }
  .sketch-card {
    border: 1.5px solid #bbb;
    border-radius: 12px;
    background: #fff;
    padding: 12px;
  }
  .sketch-tag {
    display: inline-block;
    border: 1.5px solid #aaa;
    border-radius: 20px;
    padding: 3px 10px;
    font-family: 'Caveat', cursive;
    font-size: 13px;
    background: #f9f9f7;
  }
  .sketch-tag.filled { background: #222; color: #fff; border-color: #222; }
  .sketch-divider {
    border: none;
    border-top: 1.5px dashed #ddd;
    margin: 8px 0;
  }
  .photo-slot {
    border: 2px dashed #bbb;
    border-radius: 12px;
    background: #f5f5f3;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
  }
  .photo-slot.filled {
    border: 2px solid #999;
    background: #e8e8e4;
  }
  .photo-label {
    font-family: 'Caveat', cursive;
    font-size: 13px;
    color: #888;
  }
  .camera-icon {
    width: 32px; height: 24px;
    border: 2px solid #aaa;
    border-radius: 4px;
    position: relative;
    background: #ddd;
  }
  .camera-icon::before {
    content: '';
    position: absolute;
    top: -7px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 7px;
    border: 2px solid #aaa;
    border-bottom: none;
    border-radius: 3px 3px 0 0;
    background: #ddd;
  }
  .camera-icon::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 10px; height: 10px;
    border: 1.5px solid #888;
    border-radius: 50%;
    background: #bbb;
  }
  .slider-track {
    height: 4px; background: #ddd; border-radius: 4px; position: relative;
  }
  .slider-fill {
    height: 100%; background: #222; border-radius: 4px;
  }
  .slider-thumb {
    width: 16px; height: 16px;
    border: 2px solid #222; border-radius: 50%;
    background: #fff;
    position: absolute; top: 50%; transform: translateY(-50%);
    box-shadow: 1px 1px 0 #888;
  }
  .check-box {
    width: 18px; height: 18px;
    border: 2px solid #aaa;
    border-radius: 4px;
    background: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .check-box.checked {
    background: #222;
    border-color: #222;
    color: #fff;
    font-size: 11px;
  }

  /* annotation */
  .annotation {
    font-family: 'Caveat', cursive;
    font-size: 12px;
    color: #e07050;
    background: #fff8f5;
    border: 1px solid #f0c0a0;
    border-radius: 6px;
    padding: 3px 8px;
    display: inline-block;
  }
  .annotation-line {
    position: absolute;
    border-top: 1.5px dashed #e0a080;
    pointer-events: none;
  }

  /* IA diagram */
  .ia-node {
    border: 2px solid #222;
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'Caveat', cursive;
    font-size: 15px;
    background: #fff;
    text-align: center;
    box-shadow: 2px 2px 0 #bbb;
    white-space: nowrap;
  }
  .ia-node.root {
    background: #222;
    color: #fff;
    font-size: 17px;
  }
  .ia-node.secondary {
    background: #e8f5e9;
  }
  .ia-connector {
    stroke: #555;
    stroke-width: 2;
    fill: none;
    stroke-dasharray: 5,3;
  }

  .section-label {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    font-weight: 700;
    color: #222;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .section-desc {
    font-size: 11px;
    color: #888;
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.6;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<script type="text/babel">

/* ── Shared Phone Shell ── */
function Phone({ children, label }) {
  return (
    <div style={{display:'flex', flexDirection:'column', alignItems:'center', gap:10}}>
      <div className="phone-shell">
        <div className="phone-notch"><div className="phone-notch-pill"></div></div>
        {children}
      </div>
      {label && <span className="sketch-font" style={{fontSize:14, color:'#555'}}>{label}</span>}
    </div>
  );
}

function StatusBar() {
  return (
    <div className="status-bar">
      <span>9:41</span>
      <span>피부일기</span>
      <span>●●●</span>
    </div>
  );
}

function NavBar({ active = 0 }) {
  const items = [
    { icon: '⌂', label: '홈' },
    { icon: '📷', label: '기록' },
    { icon: '◫', label: '갤러리' },
    { icon: '⇄', label: '비교' },
  ];
  return (
    <div className="nav-bar">
      {items.map((item, i) => (
        <div key={i} className={`nav-icon ${i === active ? 'active' : ''}`}>
          <div className="nav-dot">{item.icon}</div>
          <span>{item.label}</span>
        </div>
      ))}
    </div>
  );
}

/* ── Screen 1: Home ── */
function HomeScreen() {
  return (
    <div className="phone-screen" style={{display:'flex', flexDirection:'column'}}>
      <StatusBar />
      <div style={{flex:1, padding:'14px 16px', display:'flex', flexDirection:'column', gap:12}}>

        {/* Date header */}
        <div>
          <div className="sketch-font" style={{fontSize:13, color:'#aaa'}}>2026년 4월</div>
          <div className="sketch-font" style={{fontSize:30, fontWeight:700, lineHeight:1.1}}>29일 수요일</div>
        </div>

        {/* streak */}
        <div style={{display:'flex', gap:6}}>
          {[1,1,1,0,1,1,0].map((done, i) => (
            <div key={i} style={{
              width:32, height:32, borderRadius:8,
              border:'1.5px solid #ddd',
              background: done ? '#222' : '#f0f0ec',
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:9, fontFamily:'Caveat, cursive', color: done ? '#fff' : '#bbb'
            }}>{['월','화','수','목','금','토','일'][i]}</div>
          ))}
        </div>
        <div className="sketch-font" style={{fontSize:12, color:'#aaa'}}>이번 주 5일 기록 중 ✦</div>

        <hr className="sketch-divider" />

        {/* Today CTA */}
        <div className="sketch-card" style={{background:'#f0f4f0', border:'2px solid #222', padding:'16px'}}>
          <div className="sketch-font" style={{fontSize:14, color:'#666', marginBottom:4}}>오늘 기록</div>
          <div className="sketch-font" style={{fontSize:18, fontWeight:700, marginBottom:12}}>아직 안 찍었어요</div>
          <div className="sketch-btn" style={{width:'100%'}}>오늘 기록하기 →</div>
        </div>

        {/* Yesterday preview */}
        <div className="sketch-card" style={{padding:'12px'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
            <div className="sketch-font" style={{fontSize:13, color:'#777'}}>어제 기록 · 28일</div>
            <div className="sketch-font" style={{fontSize:12, color:'#aaa'}}>보기 →</div>
          </div>
          <div style={{display:'flex', gap:8}}>
            {['정면','좌','우'].map((angle, i) => (
              <div key={i} className="photo-slot filled" style={{flex:1, height:52, borderRadius:8}}>
                <div className="photo-label" style={{fontSize:10}}>{angle}</div>
              </div>
            ))}
          </div>
        </div>

        {/* quick tags */}
        <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
          <span className="sketch-tag">어제 물 6잔</span>
          <span className="sketch-tag filled">운동 O</span>
        </div>
      </div>
      <NavBar active={0} />
    </div>
  );
}

/* ── Screen 1B: Home (already recorded) ── */
function HomeRecordedScreen() {
  return (
    <div className="phone-screen" style={{display:'flex', flexDirection:'column'}}>
      <StatusBar />
      <div style={{flex:1, padding:'14px 16px', display:'flex', flexDirection:'column', gap:12}}>
        <div>
          <div className="sketch-font" style={{fontSize:13, color:'#aaa'}}>2026년 4월</div>
          <div className="sketch-font" style={{fontSize:30, fontWeight:700, lineHeight:1.1}}>29일 수요일</div>
        </div>
        <div style={{display:'flex', gap:6}}>
          {[1,1,1,0,1,1,1].map((done, i) => (
            <div key={i} style={{
              width:32, height:32, borderRadius:8,
              border:'1.5px solid #ddd',
              background: done ? '#222' : '#f0f0ec',
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:9, fontFamily:'Caveat, cursive', color: done ? '#fff' : '#bbb'
            }}>{['월','화','수','목','금','토','일'][i]}</div>
          ))}
        </div>

        {/* Recorded state */}
        <div className="sketch-card" style={{background:'#e8f5e9', border:'2px solid #4caf50', padding:'16px'}}>
          <div className="sketch-font" style={{fontSize:13, color:'#4caf50', marginBottom:4}}>✓ 오늘 기록 완료</div>
          <div style={{display:'flex', gap:8, marginBottom:10}}>
            {['정면','좌','우'].map((angle, i) => (
              <div key={i} className="photo-slot filled" style={{flex:1, height:64, borderRadius:10}}>
                <div className="photo-label" style={{fontSize:10}}>{angle}</div>
              </div>
            ))}
          </div>
          <div className="sketch-btn secondary" style={{width:'100%', textAlign:'center', fontSize:14}}>수정하기</div>
        </div>

        <div className="sketch-card">
          <div className="sketch-font" style={{fontSize:13, color:'#777', marginBottom:8}}>오늘 생활 기록</div>
          <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
            <span className="sketch-tag filled">물 7잔</span>
            <span className="sketch-tag">운동 X</span>
            <span className="sketch-tag filled">선크림</span>
          </div>
        </div>
      </div>
      <NavBar active={0} />
    </div>
  );
}

/* ── Screen 2: Photo Capture ── */
function PhotoScreen() {
  return (
    <div className="phone-screen" style={{display:'flex', flexDirection:'column'}}>
      <StatusBar />
      <div style={{flex:1, padding:'14px 16px', display:'flex', flexDirection:'column', gap:14}}>
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
          <div className="sketch-font" style={{fontSize:20, fontWeight:700}}>오늘 사진</div>
          <span className="sketch-font" style={{fontSize:13, color:'#aaa'}}>← 뒤로</span>
        </div>
        <div className="sketch-font" style={{fontSize:13, color:'#aaa', marginTop:-8}}>찍을 수 있는 것만 찍으면 돼요</div>

        {/* 3 slots */}
        <div style={{display:'flex', gap:10}}>
          {[
            {label:'정면', sub:'Front', filled: true},
            {label:'좌측', sub:'Left', filled: false},
            {label:'우측', sub:'Right', filled: false},
          ].map((slot, i) => (
            <div key={i} className={`photo-slot ${slot.filled ? 'filled' : ''}`}
              style={{flex:1, height:120, display:'flex', flexDirection:'column', gap:6, alignItems:'center', justifyContent:'center'}}>
              {slot.filled ? (
                <>
                  <div style={{width:28, height:28, borderRadius:'50%', background:'#bbb', border:'1.5px solid #999'}}></div>
                  <div className="photo-label" style={{fontSize:11}}>{slot.label}</div>
                  <div className="sketch-font" style={{fontSize:10, color:'#4caf50'}}>✓</div>
                </>
              ) : (
                <>
                  <div className="camera-icon"></div>
                  <div className="photo-label">{slot.label}</div>
                  <div className="photo-label" style={{fontSize:10}}>{slot.sub}</div>
                </>
              )}
            </div>
          ))}
        </div>

        {/* Guide overlay note */}
        <div className="sketch-card" style={{background:'#fffbf0', border:'1.5px dashed #e0c060', padding:'10px 12px'}}>
          <div className="sketch-font" style={{fontSize:13, color:'#a08020'}}>💡 가이드</div>
          <div style={{display:'flex', gap:8, marginTop:6}}>
            {['눈 높이', '자연광', '같은 거리'].map((tip, i) => (
              <div key={i} style={{
                flex:1, textAlign:'center', padding:'6px 4px',
                border:'1px solid #e0c060', borderRadius:8,
                fontSize:10, fontFamily:'Caveat, cursive', color:'#a08020',
                background:'#fffef5'
              }}>{tip}</div>
            ))}
          </div>
        </div>

        {/* Upload option */}
        <div className="sketch-btn secondary" style={{textAlign:'center', fontSize:14}}>
          📁 갤러리에서 불러오기
        </div>

        <div style={{flex:1}}></div>

        {/* CTA */}
        <div className="sketch-btn" style={{textAlign:'center'}}>다음 → 생활 기록</div>
        <div className="sketch-font" style={{textAlign:'center', fontSize:12, color:'#aaa'}}>
          사진 없이 바로 저장해도 돼요
        </div>
      </div>
      <NavBar active={1} />
    </div>
  );
}

/* ── Screen 3: Lifestyle Input ── */
function LifestyleScreen() {
  return (
    <div className="phone-screen" style={{display:'flex', flexDirection:'column'}}>
      <StatusBar />
      <div style={{flex:1, padding:'14px 16px', display:'flex', flexDirection:'column', gap:10, overflowY:'auto'}}>
        <div>
          <div className="sketch-font" style={{fontSize:20, fontWeight:700}}>생활 기록</div>
          <div className="sketch-font" style={{fontSize:13, color:'#aaa'}}>모두 선택 사항이에요</div>
        </div>

        {/* Water */}
        <div className="sketch-card">
          <div className="sketch-font" style={{fontSize:15, marginBottom:8}}>💧 물 섭취</div>
          <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
            {[1,2,3,4,5,6,7,8].map(n => (
              <div key={n} style={{
                width:30, height:30, borderRadius:6,
                border:'1.5px solid ' + (n <= 5 ? '#222' : '#ddd'),
                background: n <= 5 ? '#222' : '#f8f8f6',
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:11, fontFamily:'Caveat, cursive',
                color: n <= 5 ? '#fff' : '#bbb'
              }}>{n}</div>
            ))}
          </div>
          <div className="sketch-font" style={{fontSize:11, color:'#aaa', marginTop:6}}>5잔 선택됨</div>
        </div>

        {/* Food */}
        <div className="sketch-card">
          <div className="sketch-font" style={{fontSize:15, marginBottom:8}}>🍽 음식 / 주의 항목</div>
          <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
            {['유제품','밀가루','설탕','술','자극적','외식'].map((food, i) => (
              <div key={i} className={`sketch-tag ${i < 2 ? 'filled' : ''}`}
                style={{fontSize:12, cursor:'pointer'}}>{food}</div>
            ))}
          </div>
        </div>

        {/* Exercise */}
        <div className="sketch-card">
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <div className="sketch-font" style={{fontSize:15}}>🏃 운동</div>
            <div style={{display:'flex', gap:8}}>
              {['했어요','안 했어요'].map((opt, i) => (
                <div key={i} className={`sketch-tag ${i===0 ? 'filled' : ''}`}
                  style={{fontSize:12}}>{opt}</div>
              ))}
            </div>
          </div>
        </div>

        {/* Skincare */}
        <div className="sketch-card">
          <div className="sketch-font" style={{fontSize:15, marginBottom:8}}>🧴 스킨케어</div>
          {[
            {label:'선크림', checked: true},
            {label:'보습제', checked: true},
            {label:'트러블 제품', checked: false},
          ].map((item, i) => (
            <div key={i} style={{display:'flex', alignItems:'center', gap:8, marginBottom:6}}>
              <div className={`check-box ${item.checked ? 'checked' : ''}`}>
                {item.checked && '✓'}
              </div>
              <span className="sketch-font" style={{fontSize:14}}>{item.label}</span>
            </div>
          ))}
        </div>

        {/* Memo */}
        <div className="sketch-card">
          <div className="sketch-font" style={{fontSize:15, marginBottom:6}}>📝 한 줄 메모</div>
          <div style={{
            border:'1.5px solid #ddd', borderRadius:8, padding:'8px 10px',
            background:'#fafaf8', minHeight:36
          }}>
            <div className="sketch-font" style={{fontSize:13, color:'#ccc'}}>오늘 피부 상태 한 줄로...</div>
          </div>
        </div>

        <div className="sketch-btn" style={{textAlign:'center', marginTop:4}}>저장하고 끝내기 ✦</div>
        <div className="sketch-font" style={{textAlign:'center', fontSize:12, color:'#aaa', marginBottom:4}}>
          입력 없이 저장해도 돼요
        </div>
      </div>
      <NavBar active={1} />
    </div>
  );
}

/* ── Screen 4: Record Detail ── */
function DetailScreen() {
  return (
    <div className="phone-screen" style={{display:'flex', flexDirection:'column'}}>
      <StatusBar />
      <div style={{flex:1, padding:'14px 16px', display:'flex', flexDirection:'column', gap:12}}>
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
          <div>
            <div className="sketch-font" style={{fontSize:13, color:'#aaa'}}>2026년 4월</div>
            <div className="sketch-font" style={{fontSize:22, fontWeight:700}}>25일 토요일</div>
          </div>
          <div style={{display:'flex', gap:8}}>
            <div className="sketch-btn secondary" style={{padding:'6px 12px', fontSize:13}}>← 이전</div>
            <div className="sketch-btn secondary" style={{padding:'6px 12px', fontSize:13}}>다음 →</div>
          </div>
        </div>

        {/* Photo row */}
        <div style={{display:'flex', gap:8}}>
