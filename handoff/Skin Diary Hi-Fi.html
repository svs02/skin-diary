<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피부일기 — Hi-Fi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #e8eaf0; }
</style>
</head>
<body>
<script type="text/babel">

/* ─── Design Tokens ─── */
const C = {
  light: {
    bg: '#F2F5FA',
    surface: '#FFFFFF',
    s2: '#EDF0F7',
    s3: '#E0E6F0',
    t1: '#18202E',
    t2: '#5A6378',
    t3: '#9BA3BC',
    accent: '#6DBF8A',
    accentDim: '#DCF0E5',
    accentText: '#26694A',
    border: 'rgba(80,110,170,0.1)',
    sh: '0 2px 12px rgba(20,35,70,0.07)',
    shLg: '0 8px 32px rgba(20,35,70,0.1)',
    navBg: 'rgba(255,255,255,0.95)',
  },
  dark: {
    bg: '#0C0F1A',
    surface: '#141826',
    s2: '#1B2135',
    s3: '#232C42',
    t1: '#EEF2FA',
    t2: '#8890AA',
    t3: '#44506A',
    accent: '#72C98E',
    accentDim: '#162B22',
    accentText: '#72C98E',
    border: 'rgba(100,140,220,0.07)',
    sh: '0 2px 12px rgba(0,0,0,0.25)',
    shLg: '0 8px 40px rgba(0,0,0,0.35)',
    navBg: 'rgba(20,24,38,0.97)',
  }
};

const FONT_KO = "'Noto Sans KR', sans-serif";
const FONT_NUM = "'DM Sans', 'Noto Sans KR', sans-serif";

/* ─── Phone Shell ─── */
function PhoneShell({ children, dark = false, alwaysDark = false }) {
  const isDark = alwaysDark || dark;
  const shellBg = isDark ? '#0C0F1A' : '#F2F5FA';
  const rimColor = isDark ? '#1e2540' : '#d0d8ea';
  return (
    <div style={{
      width: 375, borderRadius: 50,
      background: shellBg,
      border: `1.5px solid ${rimColor}`,
      overflow: 'hidden', position: 'relative',
      boxShadow: isDark
        ? `0 0 0 8px #181e30, 0 40px 100px rgba(0,0,0,0.7)`
        : `0 0 0 8px #cdd5e8, 0 40px 100px rgba(20,40,90,0.18)`,
    }}>
      {/* Dynamic Island */}
      <div style={{
        position: 'absolute', top: 13, left: '50%', transform: 'translateX(-50%)',
        width: 118, height: 36, background: '#050507',
        borderRadius: 22, zIndex: 20,
      }}/>
      {/* Status bar row */}
      <div style={{
        height: 56, display: 'flex', alignItems: 'flex-end',
        justifyContent: 'space-between', padding: '0 28px 8px',
        position: 'relative', zIndex: 5,
      }}>
        <span style={{ fontSize: 13, fontWeight: 600, fontFamily: FONT_NUM, color: isDark ? 'rgba(255,255,255,0.75)' : 'rgba(0,0,0,0.6)' }}>9:41</span>
        <div style={{ display: 'flex', gap: 5, alignItems: 'center' }}>
          {/* Signal */}
          {[3,5,7,9].map((h,i) => (
            <div key={i} style={{ width: 3, height: h, borderRadius: 1.5, background: i < 3 ? (isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.55)') : (isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.2)') }}/>
          ))}
          {/* Battery */}
          <div style={{ width: 22, height: 11, border: `1.5px solid ${isDark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.4)'}`, borderRadius: 3, position: 'relative', marginLeft: 2 }}>
            <div style={{ position: 'absolute', right: -4, top: '50%', transform: 'translateY(-50%)', width: 3, height: 6, background: isDark ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.25)', borderRadius: '0 2px 2px 0' }}/>
            <div style={{ margin: 1.5, height: 6, width: '70%', background: isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.5)', borderRadius: 1 }}/>
          </div>
        </div>
      </div>
      {/* Content */}
      <div style={{ position: 'relative' }}>{children}</div>
      {/* Home bar */}
      <div style={{ display: 'flex', justifyContent: 'center', padding: '10px 0 12px', background: shellBg }}>
        <div style={{ width: 130, height: 5, borderRadius: 3, background: isDark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.14)' }}/>
      </div>
    </div>
  );
}

/* ─── Bottom Nav ─── */
function NavBar({ active = 0, dark = false }) {
  const c = C[dark ? 'dark' : 'light'];
  const navItems = [
    { label: '홈', icon: (a) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M4 10.5L12 4L20 10.5V20H15.5V15H8.5V20H4V10.5Z"
          stroke={a ? c.accent : c.t3} strokeWidth="1.6" strokeLinejoin="round"
          fill={a ? c.accentDim : 'none'}/>
      </svg>
    )},
    { label: '기록', icon: (a) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="7" width="18" height="13" rx="3" stroke={a ? c.accent : c.t3} strokeWidth="1.6" fill={a ? c.accentDim : 'none'}/>
        <circle cx="12" cy="13.5" r="3.5" stroke={a ? c.accent : c.t3} strokeWidth="1.6"/>
        <path d="M9 7L10.2 4.5H13.8L15 7" stroke={a ? c.accent : c.t3} strokeWidth="1.6" strokeLinecap="round"/>
      </svg>
    )},
    { label: '갤러리', icon: (a) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="7.5" height="7.5" rx="2" stroke={a ? c.accent : c.t3} strokeWidth="1.6" fill={a ? c.accentDim : 'none'}/>
        <rect x="13.5" y="3" width="7.5" height="7.5" rx="2" stroke={a ? c.accent : c.t3} strokeWidth="1.6" fill={a ? c.accentDim : 'none'}/>
        <rect x="3" y="13.5" width="7.5" height="7.5" rx="2" stroke={a ? c.accent : c.t3} strokeWidth="1.6" fill={a ? c.accentDim : 'none'}/>
        <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" stroke={a ? c.accent : c.t3} strokeWidth="1.6" fill={a ? c.accentDim : 'none'}/>
      </svg>
    )},
    { label: '비교', icon: (a) => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M9 5L4 12L9 19" stroke={a ? c.accent : c.t3} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
        <path d="M15 5L20 12L15 19" stroke={a ? c.accent : c.t3} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
        <line x1="12" y1="5" x2="12" y2="19" stroke={a ? c.accent : c.t3} strokeWidth="1.3" strokeDasharray="2.5 2.5"/>
      </svg>
    )},
  ];
  return (
    <div style={{
      display: 'flex', background: c.navBg,
      borderTop: `1px solid ${c.border}`,
      backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)',
      padding: '8px 0 2px',
    }}>
      {navItems.map((item, i) => (
        <div key={i} style={{
          flex: 1, display: 'flex', flexDirection: 'column',
          alignItems: 'center', gap: 2, paddingBottom: 2,
          cursor: 'pointer',
        }}>
          {item.icon(i === active)}
          <span style={{ fontSize: 10, fontFamily: FONT_KO, fontWeight: i === active ? 600 : 400, color: i === active ? c.accent : c.t3, letterSpacing: '-0.2px' }}>{item.label}</span>
        </div>
      ))}
    </div>
  );
}

/* ─── Week Strip ─── */
function WeekStrip({ dark, todayIdx = 2, recordedDays = [true,true,true,false,true,false,false] }) {
  const c = C[dark ? 'dark' : 'light'];
  const days = ['월','화','수','목','금','토','일'];
  return (
    <div style={{ display: 'flex', gap: 4 }}>
      {days.map((d, i) => {
        const isToday = i === todayIdx;
        const hasRec = recordedDays[i];
        return (
          <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5 }}>
            <div style={{
              width: 36, height: 36, borderRadius: '50%',
              border: isToday ? `2px solid ${c.accent}` : 'none',
              background: hasRec && !isToday ? c.s3 : isToday ? c.accentDim : 'transparent',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              {(hasRec || isToday) && (
                <div style={{ width: isToday ? 8 : 6, height: isToday ? 8 : 6, borderRadius: '50%', background: isToday ? c.accent : c.t3 }}/>
              )}
            </div>
            <span style={{ fontSize: 10, fontFamily: FONT_KO, color: isToday ? c.accent : c.t3, fontWeight: isToday ? 600 : 400 }}>{d}</span>
          </div>
        );
      })}
    </div>
  );
}

/* ─── Chip ─── */
function Chip({ label, variant = 'default', dark }) {
  const c = C[dark ? 'dark' : 'light'];
  const bg = variant === 'accent' ? c.accentDim : c.s2;
  const color = variant === 'accent' ? c.accentText : c.t2;
  return (
    <span style={{ fontSize: 11, fontFamily: FONT_KO, background: bg, color, borderRadius: 8, padding: '4px 9px', display: 'inline-block' }}>{label}</span>
  );
}

/* ─── Photo Slot ─── */
function PhotoSlot({ angle, filled = false, dark }) {
  const c = C[dark ? 'dark' : 'light'];
  return (
    <div style={{
      flex: 1, aspectRatio: '3/4', borderRadius: 14,
      border: filled ? 'none' : `1.5px dashed ${c.s3}`,
      background: filled ? (dark ? '#262e46' : '#D2D8E8') : c.s2,
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center', gap: 6,
      overflow: 'hidden', position: 'relative',
    }}>
      {filled ? (
        <>
          <div style={{ width: 36, height: 36, borderRadius: '50%', background: dark ? '#3d4a65' : '#b8c2d8', position: 'absolute', bottom: 18 }}/>
          <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: 36, background: dark ? 'rgba(30,38,60,0.7)' : 'rgba(200,210,228,0.6)' }}/>
        </>
      ) : (
        <>
          <div style={{ width: 22, height: 22, borderRadius: '50%', border: `1.5px dashed ${c.t3}` }}/>
          <span style={{ fontSize: 10, fontFamily: FONT_KO, color: c.t3 }}>{angle}</span>
        </>
      )}
    </div>
  );
}

/* ─── Screen: Home Empty ─── */
function HomeEmpty({ dark = false }) {
  const c = C[dark ? 'dark' : 'light'];
  return (
    <div style={{ background: c.bg, fontFamily: FONT_KO, display: 'flex', flexDirection: 'column', minHeight: 700 }}>
      {/* Header */}
      <div style={{ padding: '12px 24px 18px' }}>
        <div style={{ fontSize: 13, color: c.t3, marginBottom: 2 }}>2026년 4월</div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 18 }}>
          <span style={{ fontFamily: FONT_NUM, fontSize: 58, fontWeight: 700, lineHeight: 1, color: c.t1, letterSpacing: '-3px' }}>29</span>
          <div>
            <div style={{ fontSize: 20, fontWeight: 600, color: c.t1, letterSpacing: '-0.5px' }}>수요일</div>
            <div style={{ fontSize: 12, color: c.t3 }}>오늘</div>
          </div>
        </div>
        <WeekStrip dark={dark} />
        <div style={{ marginTop: 8, fontSize: 12, color: c.t3 }}>이번 주 4일 기록 중</div>
      </div>

      <div style={{ height: 1, background: c.border, margin: '0 24px' }}/>

      {/* Body */}
      <div style={{ padding: '18px 20px', display: 'flex', flexDirection: 'column', gap: 12, flex: 1 }}>
        {/* Today card */}
        <div style={{ background: c.surface, borderRadius: 22, padding: '18px 18px 16px', boxShadow: c.shLg, border: `1px solid ${c.border}` }}>
          <div style={{ fontSize: 11, letterSpacing: '0.6px', textTransform: 'uppercase', color: c.t3, fontWeight: 500, marginBottom: 6 }}>오늘 기록</div>
          <div style={{ fontSize: 16, fontWeight: 600, color: c.t1, marginBottom: 14, letterSpacing: '-0.3px' }}>아직 안 찍었어요</div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
            <PhotoSlot angle="정면" dark={dark}/>
            <PhotoSlot angle="좌" dark={dark}/>
            <PhotoSlot angle="우" dark={dark}/>
          </div>
          <button style={{
            width: '100%', padding: '14px 0',
            background: c.accent, border: 'none', borderRadius: 14,
            fontSize: 15, fontWeight: 600, fontFamily: FONT_KO,
            color: '#fff', cursor: 'pointer', letterSpacing: '-0.3px',
          }}>오늘 기록하기</button>
          <div style={{ textAlign: 'center', marginTop: 10, fontSize: 11, color: c.t3 }}>사진 없이 저장해도 돼요</div>
        </div>

        {/* Yesterday preview */}
        <div style={{ background: c.surface, borderRadius: 18, padding: '14px 16px', boxShadow: c.sh, border: `1px solid ${c.border}` }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
            <span style={{ fontSize: 13, fontWeight: 500, color: c.t1 }}>어제 · 28일</span>
            <span style={{ fontSize: 12, color: c.accent, fontWeight: 500 }}>보기</span>
          </div>
          <div style={{ display: 'flex', gap: 6 }}>
            <PhotoSlot angle="정면" filled dark={dark}/>
            <PhotoSlot angle="좌" filled dark={dark}/>
            <PhotoSlot angle="우" filled dark={dark}/>
          </div>
          <div style={{ display: 'flex', gap: 6, marginTop: 10, flexWrap: 'wrap' }}>
            <Chip label="물 6잔" dark={dark}/>
            <Chip label="운동" variant="accent" dark={dark}/>
            <Chip label="선크림" variant="accent" dark={dark}/>
          </div>
        </div>
      </div>
      <NavBar active={0} dark={dark}/>
    </div>
  );
}

/* ─── Screen: Home Recorded ─── */
function HomeRecorded({ dark = false }) {
  const c = C[dark ? 'dark' : 'light'];
  return (
    <div style={{ background: c.bg, fontFamily: FONT_KO, display: 'flex', flexDirection: 'column', minHeight: 700 }}>
      <div style={{ padding: '12px 24px 18px' }}>
        <div style={{ fontSize: 13, color: c.t3, marginBottom: 2 }}>2026년 4월</div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 18 }}>
          <span style={{ fontFamily: FONT_NUM, fontSize: 58, fontWeight: 700, lineHeight: 1, color: c.t1, letterSpacing: '-3px' }}>29</span>
          <div>
            <div style={{ fontSize: 20, fontWeight: 600, color: c.t1, letterSpacing: '-0.5px' }}>수요일</div>
            <div style={{ fontSize: 12, color: c.t3 }}>오늘</div>
          </div>
        </div>
        <WeekStrip dark={dark} recordedDays={[true,true,true,false,true,false,true]}/>
        <div style={{ marginTop: 8, fontSize: 12, color: c.t3 }}>이번 주 5일 기록 중</div>
      </div>

      <div style={{ height: 1, background: c.border, margin: '0 24px' }}/>

      <div style={{ padding: '18px 20px', display: 'flex', flexDirection: 'column', gap: 12, flex: 1 }}>
        {/* Completed today card */}
        <div style={{ background: c.surface, borderRadius: 22, padding: '18px 18px 16px', boxShadow: c.shLg, border: `1px solid ${c.border}` }}>
          {/* Done badge */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 10 }}>
            <div style={{ width: 18, height: 18, borderRadius: '50%', background: c.accentDim, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                <path d="M2 5L4.2 7.5L8 3" stroke={c.accent} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </div>
            <span style={{ fontSize: 12, fontWeight: 600, color: c.accentText }}>오늘 기록 완료</span>
          </div>

          <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
            <PhotoSlot angle="정면" filled dark={dark}/>
            <PhotoSlot angle="좌" filled dark={dark}/>
            <PhotoSlot angle="우" filled dark={dark}/>
          </div>

          <div style={{ display: 'flex', gap: 8 }}>
            <button style={{
              flex: 1, padding: '12px 0',
              background: 'transparent',
              border: `1.5px solid ${c.border}`,
              borderRadius: 12, fontSize: 14, fontFamily: FONT_KO,
              fontWeight: 500, color: c.t2, cursor: 'pointer',
            }}>수정</button>
            <button style={{
              flex: 2, padding: '12px 0',
              background: c.accent, border: 'none', borderRadius: 12,
              fontSize: 14, fontFamily: FONT_KO, fontWeight: 600,
              color: '#fff', cursor: 'pointer',
            }}>비교해보기</button>
          </div>
        </div>

        {/* Lifestyle summary */}
        <div style={{ background: c.surface, borderRadius: 18, padding: '14px 16px', boxShadow: c.sh, border: `1px solid ${c.border}` }}>
          <div style={{ fontSize: 13, fontWeight: 500, color: c.t1, marginBottom: 10 }}>오늘 생활 기록</div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            <Chip label="물 7잔" variant="accent" dark={dark}/>
            <Chip label="운동" variant="accent" dark={dark}/>
            <Chip label="선크림" variant="accent" dark={dark}/>
            <Chip label="유제품" dark={dark}/>
          </div>
          <div style={{ marginTop: 10, padding: '10px 12px', background: c.s2, borderRadius: 10 }}>
            <span style={{ fontSize: 12, color: c.t2, fontStyle: 'italic' }}>"코 옆이 살짝 건조했음"</span>
          </div>
        </div>
      </div>
      <NavBar active={0} dark={dark}/>
    </div>
  );
}

/* ─── Screen: Camera Guide ─── */
function CameraGuide() {
  const conditions = [
    { label: '조명 충분', ok: true },
    { label: '얼굴 가이드 안에', ok: true },
    { label: '정면 응시', ok: false },
  ];
  return (
    <div style={{ background: '#0A0A0F', fontFamily: FONT_KO, display: 'flex', flexDirection: 'column', minHeight: 700 }}>
      {/* Top bar */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 22px 10px' }}>
        <span style={{ fontSize: 14, color: 'rgba(255,255,255,0.45)', fontFamily: FONT_KO }}>취소</span>
        <span style={{ fontSize: 15, fontWeight: 600, color: '#fff', fontFamily: FONT_KO }}>정면</span>
        <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'rgba(255,255,255,0.08)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.5)' }}>?</span>
        </div>
      </div>

      {/* Angle progress */}
      <div style={{ display: 'flex', justifyContent: 'center', gap: 20, padding: '0 0 14px' }}>
        {[{label:'정면', active:true, done:false}, {label:'좌측', active:false, done:false}, {label:'우측', active:false, done:false}].map((a, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <div style={{
              width: 6, height: 6, borderRadius: '50%',
              background: a.active ? '#72C98E' : 'rgba(255,255,255,0.2)',
            }}/>
            <span style={{ fontSize: 11, fontFamily: FONT_KO, color: a.active ? '#fff' : 'rgba(255,255,255,0.3)', fontWeight: a.active ? 500 : 400 }}>{a.label}</span>
          </div>
        ))}
      </div>

      {/* Viewfinder */}
      <div style={{ flex: 1, position: 'relative', margin: '0 14px', borderRadius: 24, overflow: 'hidden', background: '#111118', minHeight: 340 }}>
        {/* Subtle radial bg */}
        <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(ellipse 60% 75% at 50% 50%, rgba(50,60,90,0.4) 0%, rgba(5,5,10,0.9) 100%)' }}/>

        {/* Face guide SVG */}
        <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }} viewBox="0 0 347 360" preserveAspectRatio="xMidYMid meet">
          <defs>
            <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stopColor="rgba(114,201,142,0.08)"/>
              <stop offset="100%" stopColor="rgba(114,201,142,0)"/>
            </radialGradient>
            <mask id="ovalMask">
              <rect width="347" height="360" fill="white"/>
              <ellipse cx="173" cy="175" rx="98" ry="122" fill="black"/>
            </mask>
          </defs>
          {/* Dim overlay outside oval */}
          <rect width="347" height="360" fill="rgba(5,5,10,0.45)" mask="url(#ovalMask)"/>
          {/* Glow inside oval */}
          <ellipse cx="173" cy="175" rx="98" ry="122" fill="url(#glowGrad)"/>
          {/* Oval guide */}
          <ellipse cx="173" cy="175" rx="98" ry="122"
            fill="none" stroke="rgba(114,201,142,0.7)" strokeWidth="1.5"
            strokeDasharray="8 5"/>
          {/* Eye level guide */}

/* ─── Screen: Compare Step 3 (드래그 슬라이더) ─── */
function HiFiCompareStep3({ dark = false }) {
  const c = C[dark ? 'dark' : 'light'];
  const [split, setSplit] = React.useState(50);
  const trackRef = React.useRef(null);

  function handleMouseDown(e) {
    const move = (ev) => {
      if (!trackRef.current) return;
      const rect = trackRef.current.getBoundingClientRect();
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const pct = Math.max(5, Math.min(95, ((clientX - rect.left) / rect.width) * 100));
      setSplit(pct);
    };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up); };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    document.addEventListener('touchmove', move, { passive: true });
    document.addEventListener('touchend', up);
  }

  return (
    <div style={{ background: '#0A0A0F', fontFamily: FONT_KO, display: 'flex', flexDirection: 'column', minHeight: 700 }}>
      {/* Top bar */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 22px 10px' }}>

          </DCArtboard>
          <DCArtboard id="home-recorded" label="홈 — 기록 완료 (라이트)" width={430} height={860}>
            <ABWrap bg={dark ? '#151922' : '#d8deea'} label="Screen 1B · 홈 완료" annotations={['조용한 체크 뱃지', '비교 CTA 자연스럽게 등장', '생활기록 요약 카드']}>
              <PhoneShell dark={dark}>
                <HomeRecorded dark={dark}/>
              </PhoneShell>
            </ABWrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="camera" title="카메라 · 촬영 가이드">
          <DCArtboard id="cam-guide" label="카메라 — 가이드 오버레이" width={430} height={860}>
            <ABWrap bg="#0e1018" label="Screen 2A · 카메라 가이드" annotations={['얼굴 타원 점선 + 내부 글로우', '눈높이 가이드라인', '실시간 조건 체크']}>
              <PhoneShell alwaysDark>
                <CameraGuide/>
              </PhoneShell>
            </ABWrap>
          </DCArtboard>
          <DCArtboard id="cam-angle" label="카메라 — 각도 전환 (정면→좌)" width={430} height={860}>
            <ABWrap bg="#0c0e16" label="Screen 2B · 각도 전환" annotations={['정면 완료 토스트', '타원 위치 이동 (사이드 각도)', '완료 썸네일 우상단']}>
              <PhoneShell alwaysDark>
                <CameraAngleSwitch/>
              </PhoneShell>
            </ABWrap>
          </DCArtboard>
        </DCSection>
        <DCSection id="lifestyle" title="생활 기록 입력">
          <DCArtboard id="lifestyle-input" label="생활 기록 — 입력" width={430} height={860}>
            <ABWrap bg={dark ? '#1a1e2c' : '#dde3ef'} label="Screen 3 · 생활기록" annotations={['물: 탭으로 잔 수 선택', '음식·운동: 토글 태그', '전항목 선택 사항']}>
              <PhoneShell dark={dark}><LifestyleInput dark={dark}/></PhoneShell>
            </ABWrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="detail" title="기록 상세 보기">
          <DCArtboard id="record-detail" label="기록 상세 — 날짜별 카드" width={430} height={860}>
            <ABWrap bg={dark ? '#151922' : '#d8deea'} label="Screen 4 · 상세보기" annotations={['날짜 히어로 + 주간 미니 캘린더', '"이 날짜로 비교하기" 빠른 진입', '생활기록 요약 + 메모']}>
              <PhoneShell dark={dark}><RecordDetail dark={dark}/></PhoneShell>
            </ABWrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="compare-flow" title="얼굴 비교 — 3단계 플로우">
          <DCArtboard id="compare-s1" label="비교 Step 1 — 날짜 선택" width={430} height={860}>
            <ABWrap bg={dark ? '#141a20' : '#dae4da'} label="Screen 5A · 날짜 선택" annotations={['빠른 선택 프리셋', '캘린더 직접 선택', '기록 있는 날짜에만 점 표시']}>
              <PhoneShell dark={dark}><HiFiCompareStep1 dark={dark}/></PhoneShell>
            </ABWrap>
          </DCArtboard>
          <DCArtboard id="compare-s2" label="비교 Step 2 — 각도 선택" width={430} height={860}>
            <ABWrap bg={dark ? '#131b18' : '#d8e8dc'} label="Screen 5B · 각도 선택" annotations={['썸네일 미리보기', '양쪽 다 있는 각도만 활성', '없는 이유 명시']}>
              <PhoneShell dark={dark}><HiFiCompareStep2 dark={dark}/></PhoneShell>
            </ABWrap>
          </DCArtboard>
          <DCArtboard id="compare-s3" label="비교 Step 3 — 드래그 비교" width={430} height={860}>
            <ABWrap bg="#0a0c14" label="Screen 5C · 드래그 슬라이더" annotations={['핸들 좌우 드래그로 before/after 분할', '날짜 레이블 항상 노출', '타임라인 스크러버']}>
              <PhoneShell alwaysDark><HiFiCompareStep3 dark={dark}/></PhoneShell>
            </ABWrap>
          </DCArtboard>
        </DCSection>

      </DesignCanvas>

      <TweaksPanel>
        <TweakSection title="테마">
          <TweakToggle label="다크 모드" value={dark} onChange={v => setTweak('darkMode', v)}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
<div id="root"></div>
</body>
</html>
